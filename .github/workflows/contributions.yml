name: Cobrinha de contribuições

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: profile-contributions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?palette=github-light&color_snake=%235f32a8
            assets/contributions-dark.svg?palette=github-dark&color_snake=%23c798ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar animação das contribuições"
          git push
